# aozoraquest edge Worker。
# - M1 (docs/21-server-authority §4.2): AT Proto service auth JWT を検証して呼び出し元 DID を
#   確定する認証基盤。secp256k1 検証は verify 専用 k256 WASM (Workers subtle は secp256k1 非対応)。
# - 予定: あおぞらワールドのゲーム経済をサーバー権威化 (M2〜)、依頼クエスト集約 (docs/15)。
#   これらは Worker が app サーバーアカウントの PDS を書く。
# nodejs_compat は現状の M1 コードには不要だが、M2 で `@atproto/api` (PDS 書込) を読む際に
# 要る想定なので残す。@atproto/oauth-client-node は Workers 非互換のため使わない (削除済)。

name = "aozoraquest-edge"
main = "src/index.ts"
compatibility_date = "2026-04-24"
compatibility_flags = ["nodejs_compat"]

# OAuth write 認証 (docs/21 §12) のトークンストア。cron refresher が書き、リクエスト Worker が読む。
# 実行時に書き換えられる保管場所が要るので Secret/env でなく KV (Durable Object は Paid 要で不採用)。
# Kojiran@gmail.com アカウントに作成 (wrangler kv namespace create OAUTH_TOKENS)。
[[kv_namespaces]]
binding = "OAUTH_TOKENS"
id = "fa7215e005474e6cac81745c463333ba"
preview_id = "c1f3e394d104413192a0dac7303b6443"

# OAuth トークンの唯一の refresh 実行者 (docs/21 §12)。10 分ごとに起動し、access token 失効前に
# refresh_token で更新する (REFRESH_AHEAD_SEC=900 = 15 分前から。cron 間隔 < ahead で取りこぼし防止)。
[triggers]
crons = ["*/10 * * * *"]
