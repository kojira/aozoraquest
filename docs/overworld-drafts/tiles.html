<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>あおぞらワールド タイル案 v2</title>
<style>
  body { font-family: system-ui, sans-serif; background: #1b2530; color: #eef4f7; padding: 24px; }
  h1 { font-size: 20px; } h2 { font-size: 16px; margin-top: 28px; }
  .tiles { display: flex; gap: 18px; flex-wrap: wrap; }
  .tile-card { text-align: center; }
  .tile-card svg { display: block; border-radius: 6px; box-shadow: 0 3px 8px rgba(0,0,0,.4); }
  .tile-card .name { margin-top: 6px; font-size: 13px; }
  .tile-card .note { font-size: 11px; color: #9db4c4; }
  #map { image-rendering: pixelated; border: 4px solid #ffffff; border-radius: 4px; box-shadow: 0 6px 16px rgba(0,0,0,.5); }
  .cap { font-size: 12px; color: #9db4c4; margin-top: 6px; }
</style>
</head>
<body>
<h1>あおぞらワールド — マップ構成パーツ (案 v2)</h1>

<h2>タイル一覧 (拡大 96px)</h2>
<div class="tiles" id="palette"></div>

<h2>16×16 ビューポート実寸イメージ (1 タイル 22px ≒ スマホ実寸)</h2>
<svg id="map" width="352" height="352" viewBox="0 0 352 352"></svg>
<div class="cap">中央がプレイヤー (実装ではユーザーのアバター + ジョブ装備をそのまま描画)。川に橋。右上は「未踏の霧」(まだ歩いていない場所)。</div>

<script>
// ─── タイル定義 (32x32 viewBox の SVG 断片) ───
const PLAINS_BG = `
    <rect width="32" height="32" fill="#9dd07f"/>
    <path d="M6 22 l2 -4 l2 4 M20 12 l2 -4 l2 4" stroke="#7db95f" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <circle cx="26" cy="24" r="1.2" fill="#b8e29a"/>
    <circle cx="12" cy="8" r="1.2" fill="#b8e29a"/>`;
const T = {
  plains: PLAINS_BG,
  grove: `
    <rect width="32" height="32" fill="#8cc46f"/>
    <ellipse cx="10" cy="14" rx="6" ry="7" fill="#4f9e4a"/>
    <rect x="9" y="19" width="2.4" height="5" fill="#7a5a3a"/>
    <ellipse cx="23" cy="21" rx="5" ry="6" fill="#5cab54"/>
    <rect x="22" y="25" width="2.2" height="4" fill="#7a5a3a"/>`,
  forest: `
    <rect width="32" height="32" fill="#4f8f4a"/>
    <path d="M8 20 L13 8 L18 20 Z" fill="#2f6e35"/>
    <path d="M17 24 L22 12 L27 24 Z" fill="#255d2c"/>
    <path d="M3 27 L8 16 L13 27 Z" fill="#2a6631"/>
    <rect x="12" y="20" width="2" height="5" fill="#5d4630"/>
    <rect x="21" y="24" width="2" height="4" fill="#5d4630"/>`,
  pond: `
    <rect width="32" height="32" fill="#9dd07f"/>
    <ellipse cx="16" cy="17" rx="11" ry="8.5" fill="#57b7ee"/>
    <ellipse cx="16" cy="17" rx="11" ry="8.5" fill="none" stroke="#3e94c9" stroke-width="1.6"/>
    <path d="M10 16 q3 -2 6 0 M14 20 q3 -2 6 0" stroke="#bfe6ff" stroke-width="1.4" fill="none" stroke-linecap="round"/>`,
  water: `
    <rect width="32" height="32" fill="#57b7ee"/>
    <path d="M2 10 q4 -3 8 0 t8 0 t8 0 t8 0 M-2 20 q4 -3 8 0 t8 0 t8 0 t8 0 M2 30 q4 -3 8 0 t8 0 t8 0"
      stroke="#bfe6ff" stroke-width="1.6" fill="none" stroke-linecap="round"/>`,
  bridge: `
    <rect width="32" height="32" fill="#57b7ee"/>
    <path d="M2 10 q4 -3 8 0 t8 0 t8 0 t8 0 M2 30 q4 -3 8 0 t8 0 t8 0" stroke="#bfe6ff" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <rect x="0" y="12" width="32" height="9" fill="#b08a5c"/>
    <path d="M0 12 h32 M0 21 h32" stroke="#8a6a42" stroke-width="1.6"/>
    <path d="M4 12 v9 M10 12 v9 M16 12 v9 M22 12 v9 M28 12 v9" stroke="#8a6a42" stroke-width="1.2"/>
    <path d="M0 11 h32 M0 22 h32" stroke="#6e5334" stroke-width="1"/>`,
  mountain: `
    <rect width="32" height="32" fill="#8cc46f"/>
    <path d="M2 28 L12 8 L20 28 Z" fill="#8a7f74"/>
    <path d="M12 8 L15.5 15 L12.5 15 L16 22 L20 28 L12 28 Z" fill="#6e655c" opacity=".55"/>
    <path d="M9.5 13 L12 8 L14.5 13 L12.8 12 L12 13.6 L11 12 Z" fill="#f2f5f7"/>
    <path d="M14 28 L23 12 L31 28 Z" fill="#9b8f83"/>
    <path d="M20.8 16 L23 12 L25.2 16 L23.7 15 L23 16.4 L22 15 Z" fill="#f2f5f7"/>`,
  town: PLAINS_BG + `
    <rect x="5" y="15" width="9" height="9" fill="#f0e6d2"/>
    <path d="M3.5 15.5 L9.5 8.5 L15.5 15.5 Z" fill="#c9564a"/>
    <rect x="8" y="19" width="3" height="5" fill="#7a5a3a"/>
    <rect x="18" y="17" width="9" height="8" fill="#f0e6d2"/>
    <path d="M16.5 17.5 L22.5 11.5 L28.5 17.5 Z" fill="#4a7fc9"/>
    <rect x="20" y="19.5" width="2.4" height="2.4" fill="#57b7ee"/>
    <rect x="24" y="19.5" width="2.4" height="2.4" fill="#57b7ee"/>`,
  // 未踏の霧: 真っ黒でなく「雲の下」の表現 (青灰 + もや)
  fog: `
    <rect width="32" height="32" fill="#3a4a5a"/>
    <path d="M4 12 q4 -4 8 0 q4 -4 8 0 q3 -3 8 0" stroke="#4e6275" stroke-width="3.4" fill="none" stroke-linecap="round" opacity=".8"/>
    <path d="M2 22 q4 -4 8 0 q4 -4 8 0 q3 -3 8 0" stroke="#465a6c" stroke-width="3.4" fill="none" stroke-linecap="round" opacity=".8"/>
    <circle cx="24" cy="8" r="1" fill="#55697c"/>
    <circle cx="8" cy="28" r="1" fill="#55697c"/>`,
  // プレイヤー: 実装ではユーザーの実アバター画像 + ジョブ装備 (job-equipment.tsx) を使う。
  // ここではドラフト用の擬似アバター (円形アイコン + 白リング + ジョブ装備の例: 剣+盾)。
  player: `
    <circle cx="16" cy="16" r="10.5" fill="#ffe1c4"/>
    <path d="M5.5 16 a10.5 10.5 0 0 1 21 0 Z" fill="#8a6a4a"/>
    <circle cx="12.5" cy="17.5" r="1.3" fill="#1b2530"/>
    <circle cx="19.5" cy="17.5" r="1.3" fill="#1b2530"/>
    <path d="M13 21.5 q3 2 6 0" stroke="#1b2530" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <circle cx="16" cy="16" r="11.5" fill="none" stroke="#ffffff" stroke-width="2"/>
    <circle cx="16" cy="16" r="13" fill="none" stroke="#f5c542" stroke-width="1.4"/>
    <path d="M26 6 l3 3 M27.5 4.5 l3 3 M26.8 8.2 l3.4 -3.4" stroke="#d8dee6" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M3 22 a4 4.5 0 0 0 8 0 v-3 h-8 Z" fill="#5a8ad6" stroke="#ffffff" stroke-width="1.3"/>`,
};

const NAMES = [
  ['plains',   '平地',   '遭遇 低 / 基本地形'],
  ['grove',    '林',     '遭遇 中'],
  ['forest',   '森',     '遭遇 高・実入り大'],
  ['pond',     '池',     '通行不可 (将来カヌー)'],
  ['water',    '川・海', '通行不可 (将来 船)'],
  ['bridge',   '橋',     '川を渡れる (通行可)'],
  ['mountain', '山',     '通行不可 (将来 飛行船)'],
  ['town',     '街',     '安全地帯・なんでも屋 (平地の上)'],
  ['fog',      '未踏の霧', 'まだ歩いていない場所'],
  ['player',   'プレイヤー', '実装ではユーザーの実アバター + ジョブ装備'],
];

const palette = document.getElementById('palette');
for (const [key, name, note] of NAMES) {
  const bg = key === 'player' ? PLAINS_BG + T.player : T[key];
  palette.insertAdjacentHTML('beforeend', `
    <div class="tile-card">
      <svg width="96" height="96" viewBox="0 0 32 32">${bg}</svg>
      <div class="name">${name}</div>
      <div class="note">${note}</div>
    </div>`);
}

// ─── 16x16 サンプルマップ ───
// P=plains g=grove F=forest o=pond W=water B=bridge M=mountain T=town .=未踏
const rows = [
  'PPggFFFF..WWWWPP',
  'PPgFFFFF..WWWPPP',
  'PggFFFFg..WWPPgg',
  'PPgFFgg...WWPggg',
  'PPPggPPP..WWPPgF',
  'gPPPPPTP..WWWPPF',
  'ggPPPPPP...WWPPP',
  'FgPPoPPPPP.BBPPP',
  'FFgPPPPPPPWWPPPg',
  'FFgPPPPPPWWPPPgg',
  'MFggPPPPPWWPPggF',
  'MMFgPPPPWWPPPgFF',
  'MMMgggPPWWPPggFF',
  'MMMMgPPPWWPPgFFF',
  'MMMMMgPPPWWggFFF',
  'MMMMMMgPPWWWgFFF',
];
const KEY = { P: 'plains', g: 'grove', F: 'forest', o: 'pond', W: 'water', B: 'bridge', M: 'mountain', T: 'town' };
const map = document.getElementById('map');
let svg = '';
for (let y = 0; y < 16; y++) {
  for (let x = 0; x < 16; x++) {
    const ch = rows[y][x];
    const gx = x * 22, gy = y * 22;
    const body = ch === '.' ? T.fog : T[KEY[ch]];
    svg += `<g transform="translate(${gx},${gy}) scale(0.6875)">${body}</g>`;
  }
}
// プレイヤー (中央 8,8)
svg += `<g transform="translate(${8 * 22},${8 * 22}) scale(0.6875)">${T.player}</g>`;
map.innerHTML = svg;
</script>
</body>
</html>
